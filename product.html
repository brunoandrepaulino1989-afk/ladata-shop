/* Layout: On-style product page. Two-column: image gallery left (2-up grid), sticky buy panel right with accordions. Then a club band and a "complete your routine" rail. All white. */
:root{
  --bg:#ffffff;
  --ink:#111111;
  --muted:#6b6b6b;
  --line:#e3e3e1;
  --soft:#f5f5f5;
  --cream:#f6f1e7;
  --red:#b0141f;
  --sale:#c8381e;
  --ok:#2f7a4a;
  --font:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{display:block}

.promo{color:var(--muted);text-align:center;font-size:13px;border-bottom:1px solid var(--line)}
.promo .wrap{padding-block:9px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:32px;height:64px}
.logo{display:block;flex:0 0 auto}
.logo img{height:34px;width:auto}
nav{display:flex;gap:26px;font-size:15px;font-weight:500}
nav a:hover{text-decoration:underline;text-underline-offset:6px}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;flex:0 0 auto}
.bag{position:relative}
.bag b{position:absolute;top:-6px;right:-9px;border:1px solid var(--ink);background:var(--bg);font-size:10px;border-radius:9px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
nav a{white-space:nowrap}
@media (max-width:1180px){nav{gap:18px}.search span{display:none}}
@media (max-width:900px){header .wrap{flex-wrap:wrap;height:auto;padding-block:12px 0;row-gap:4px}nav{order:3;width:100%;overflow-x:auto;scrollbar-width:none;gap:22px;padding:8px 0 12px;font-size:14px}nav::-webkit-scrollbar{display:none}}

.crumbs{font-size:13px;color:var(--muted);padding-block:18px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
.pnav{display:flex;align-items:center;gap:6px;font-size:13px}
.pnav a{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;max-width:220px}
.pnav a:hover{border-color:var(--ink)}
.pnav a span{overflow:hidden;text-overflow:ellipsis}
.pnav .ico{width:16px;height:16px}
.pnav select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--bg);color:var(--ink);max-width:200px}
@media (max-width:700px){.pnav{width:100%;margin-top:-8px;padding-bottom:10px}.pnav select{flex:1;min-width:0;max-width:none}.pnav a span{display:none}}

/* main */
.pdp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:start}
.gallery{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);min-width:0}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border:1px solid var(--line);height:clamp(280px,calc(100svh - 330px),540px)}
.gal::-webkit-scrollbar{display:none}
.gal figure{margin:0;position:relative;flex:0 0 100%;scroll-snap-align:start;overflow:hidden;background:var(--bg)}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal img.contain{object-fit:contain;padding:8%}
.gallery .badge{position:absolute;top:14px;left:14px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);padding:3px 8px;z-index:2}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.arrow.prev{left:14px}.arrow.next{right:14px}
.arrow[disabled]{opacity:.35;cursor:default}
.thumbs{display:flex;gap:8px;margin-top:10px;align-items:center}
.thumbs button{width:64px;height:64px;border:1px solid var(--line);background:var(--bg);padding:0;cursor:pointer;position:relative;overflow:hidden;flex:0 0 auto}
.thumbs button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs button img.contain{object-fit:contain;padding:6px}
.thumbs button[aria-current="true"]{border-color:var(--ink)}
.thumbs .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mbar{display:none}
@media (max-width:700px){.mbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(110%);transition:transform .25s}
.mbar.on{transform:none}.mbar div{flex:1;min-width:0;font-size:14px}.mbar b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar button{border:0;border-radius:999px;padding:12px 20px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer}.mbar button[disabled]{background:var(--soft);color:var(--muted)}}

.buy{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);display:flex;flex-direction:column;gap:14px;min-width:0}
.cat{font-size:13px;color:var(--muted)}
.buy h1{font-size:clamp(28px,2.6vw,40px);font-weight:600;letter-spacing:-.03em;line-height:1.02;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:16px;margin-top:-10px}
.price{font-size:20px;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.price s{color:var(--muted);font-size:16px}
.price .now{color:var(--sale)}
.price small{font-size:13px;color:var(--muted)}
.lead{margin:0;font-size:15.5px;max-width:52ch}
.opts{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.opts b{color:var(--ink);font-weight:600}
.stock{display:flex;gap:8px;align-items:center;font-size:14px}
.stock i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stock.out i{background:var(--muted)}
.add{display:flex;gap:8px}
.add button{flex:1;border:0;border-radius:999px;padding:16px;font-weight:600;font-size:16px;background:var(--ink);color:#fff;cursor:pointer}
.add button[disabled]{background:var(--soft);color:var(--muted);cursor:not-allowed}
.add .wish{flex:0 0 54px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.add .wish[aria-pressed="true"] svg{fill:var(--ink)}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.perks li{display:flex;gap:10px;align-items:center}
.try{background:var(--cream);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.try b{display:block;font-weight:600}
.try a{border-bottom:1px solid var(--ink);font-weight:500;white-space:nowrap}

.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:600}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-weight:400;font-size:20px;line-height:1}
.acc details[open] summary::after{content:"−"}
.acc .in{padding:0 0 18px;color:var(--muted);font-size:14.5px}
.acc .in p{margin:0 0 10px;max-width:56ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;color:var(--ink)}
@media (max-width:700px){.pdp{grid-template-columns:1fr;gap:24px}.buy{position:static}.gallery{position:relative;top:0}.gal{height:min(44svh,380px)}.thumbs button{width:44px;height:44px}.buy .lead{display:none}.buy{gap:14px}.pdp{gap:18px}.thumbs{margin-top:8px}}
@media (min-width:701px) and (max-width:900px){.pdp{gap:24px}.buy .lead{display:none}.gal{height:clamp(260px,calc(100svh - 300px),420px)}}
@media (max-width:560px){.arrow{display:none}.gal{height:min(32svh,250px)}.buy .cat{display:none}.thumbs button{width:44px;height:44px}}

/* club band */
.band{margin-top:88px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.band .img{position:relative;min-height:440px}
.band .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band .txt{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.band h2{font-size:clamp(28px,3vw,42px);font-weight:600;letter-spacing:-.035em;line-height:1.02;margin:0;text-wrap:balance}
.band p{margin:0;color:var(--muted);max-width:46ch;font-size:16px}
.btn{display:inline-block;align-self:flex-start;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;border:1px solid var(--ink);background:var(--ink);color:#fff}
@media (max-width:900px){.band{grid-template-columns:1fr}.band .img{min-height:0;aspect-ratio:4/3}.band .txt{padding:28px 20px}}
.band .img img.zoom{transform:scale(1.7);transform-origin:52% 40%}
.bfb{margin-top:72px;background:var(--red);color:#fff;display:flex;align-items:center;gap:14px 28px;padding:18px 28px;flex-wrap:wrap}
.bfb .tag{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;padding-right:28px;border-right:1px solid rgba(255,255,255,.35);white-space:nowrap}
.bfb .mid{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex:1;min-width:0}
.bfb h2{font-size:18px;font-weight:500;letter-spacing:-.01em;line-height:1.2;margin:0}
.bfb p{margin:0;font-size:13px;opacity:.75}
.bfb .r{display:flex;align-items:center;gap:28px}
.bfb .cd{display:flex;align-items:baseline;gap:4px;font-size:15px;font-variant-numeric:tabular-nums}
.bfb .cd small{font-size:11px;opacity:.7;margin-left:1px}.bfb .cd i{font-style:normal;opacity:.45;margin:0 4px}
.bfb a{color:#fff;font-size:14px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:2px;white-space:nowrap}
.bfb a:hover{border-color:#fff}
@media (max-width:900px){.bfb{padding:16px 18px;gap:10px 20px}.bfb .tag{border:0;padding:0;width:100%}.bfb .r{width:100%;justify-content:space-between}}

/* rail */
.more{padding-block:72px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.sh h2{font-size:clamp(24px,2.6vw,34px);font-weight:600;letter-spacing:-.03em;line-height:1;margin:0}
.sh a{font-weight:500;border-bottom:1px solid var(--ink);padding-bottom:2px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card .t{aspect-ratio:1;border:1px solid var(--line);position:relative;overflow:hidden}
.card .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%;transition:transform .5s ease}
.card .t img.cover{object-fit:cover;padding:0}
.card:hover .t img{transform:scale(1.04)}
.nm{font-weight:600}
.cs{color:var(--muted);font-size:14px}
.pr{font-variant-numeric:tabular-nums}
.vat{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}


footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-block:32px;color:var(--muted);font-size:13px}
footer .logo img{height:28px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.08);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// Black Friday: 15% off every price until the sale ends, then prices revert automatically.
const BF_END=new Date('2026-12-01T23:59:59+00:00'),BF_ON=Date.now()<BF_END;
const bfPrice=x=>{if(BF_ON&&x.p!=null){x.was=x.p;x.p=Math.round(x.p*85)/100}};
P.forEach(x=>{bfPrice(x);x.slug=x.n.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/-$/,'')});

 mass:['l-massage-knee.jpg','Use it like we do','Two minutes per muscle group after the sauna, slow passes, light pressure. Ask for a demo at the club before you buy.'],
 comp:['l-compression.jpg','Straight from the Recovery Room','JetBoots are part of every Recovery Room session at Ladata Matosinhos. Try a session and feel the difference in your legs.'],
 care:['l-oil-shelf.jpg','Made at the House of Human Optimisation','The same oil we keep on the shelf at the club, for the last ten minutes of your recovery.'],

const $=id=>document.getElementById(id);
const eur=n=>'€'+n.toLocaleString('en-IE',{minimumFractionDigits:n%1?2:0});
let wish=new Set();
function render(){
  const slug=(location.hash||'').slice(1);
  const p=P.find(x=>x.slug===slug)||P.find(x=>x.slug==='theragun-mini');
  document.title=p.n+' · Ladata';
  const k=P.indexOf(p),prv=P[(k-1+P.length)%P.length],nxt=P[(k+1)%P.length];
  $('pnav').innerHTML=`<a href="#${prv.slug}" aria-label="Previous product: ${prv.n}"><svg class="ico" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg><span>${prv.n}</span></a><select id="jump" aria-label="Jump to product">${P.map((x,j)=>`<option value="${x.slug}"${x===p?' selected':''}>${j+1}/${P.length} · ${x.n}</option>`).join('')}</select><a href="#${nxt.slug}" aria-label="Next product: ${nxt.n}"><span>${nxt.n}</span><svg class="ico" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></a>`;
  $('jump').onchange=e=>{location.hash=e.target.value};
  $('crumbs').innerHTML=`<a href="/">Home</a><span>/</span><a href="/shop">All products</a><span>/</span><a href="/shop#${CH[p.c]}">${CAT[p.c]}</a><span>/</span><span style="color:var(--ink)">${p.n}</span>`;
  const badge=p.out?'Sold out':p.was?(BF_ON?'−15%':'Sale'):p.neu?'New':'';
  const imgs=[[p.main||`${p.slug}.jpg`,p.n,p.main?true:!p.cover]].concat((p.g||[]).concat(LIFE[p.c]||[]).map(([f,a])=>[f,a,false]));
  const arr=d=>`<svg class="ico" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  $('gallery').innerHTML=`${badge?`<span class="badge"${badge==='Sale'||badge==='−15%'?' style="color:var(--sale)"':''}>${badge}</span>`:''}<div class="gal" id="gal" tabindex="0" aria-label="${p.n} images">${imgs.map(([f,a,contain],i)=>`<figure><img class="${contain?'contain':''}" src="/img/${f}" alt="${a}"${i?' loading="lazy"':''}></figure>`).join('')}</div>${imgs.length>1?`<button class="arrow prev" aria-label="Previous image">${arr('m15 5-7 7 7 7')}</button><button class="arrow next" aria-label="Next image">${arr('m9 5 7 7-7 7')}</button>`:''}<div class="thumbs">${imgs.length>1?imgs.map(([f,a,contain],i)=>`<button data-i="${i}" aria-label="Image ${i+1}"><img class="${contain?'contain':''}" src="/img/${f}" alt=""></button>`).join(''):''}<span class="count" id="count"></span></div>`;
  const gal=$('gal'),n=imgs.length,cur=()=>Math.round(gal.scrollLeft/gal.clientWidth);
  const go=i=>gal.scrollTo({left:Math.max(0,Math.min(n-1,i))*gal.clientWidth,behavior:'smooth'});
  const sync=()=>{const i=cur();$('count').textContent=n>1?`${i+1} / ${n}`:'';document.querySelectorAll('.thumbs button').forEach((b,j)=>b.setAttribute('aria-current',j===i));const pv=document.querySelector('.arrow.prev'),nx=document.querySelector('.arrow.next');if(pv){pv.disabled=i===0;nx.disabled=i===n-1}};
  gal.addEventListener('scroll',()=>requestAnimationFrame(sync));sync();
  document.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const pv=document.querySelector('.arrow.prev');if(pv){pv.onclick=()=>go(cur()-1);document.querySelector('.arrow.next').onclick=()=>go(cur()+1)}
  gal.onkeydown=e=>{if(e.key==='ArrowRight')go(cur()+1);if(e.key==='ArrowLeft')go(cur()-1)};
  const price=p.p==null?'<span style="color:var(--muted)">Price to be confirmed</span>':p.was?`<span class="now">${eur(p.p)}</span><s>${eur(p.was)}</s><small>VAT not included</small>`:`${eur(p.p)}<small>VAT not included</small>`;
  const facts=[['Category',CAT[p.c]]].concat(p.f||[]);
  $('buy').innerHTML=`
    <span class="cat">${CAT[p.c]}${p.c==='care'?' · Made by Ladata':''}</span>
    <h1>${p.n}</h1>
    <div class="sub">${p.s}</div>
    <div class="price">${price}</div>
    <p class="lead">${p.d}</p>
    ${p.opts?`<div class="opts">${p.opts}</div>`:''}
    <div class="stock${p.out?' out':''}"><i></i>${p.out?'Sold out · we will email you when it is back':'In stock · ships in 1–2 working days'}</div>
    <div class="add"><button id="addBtn">Add to bag</button><button class="wish" id="wishBtn" aria-pressed="${wish.has(p.slug)}" aria-label="Save ${p.n}"><svg class="ico" viewBox="0 0 24 24" style="margin:auto"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button></div>
    <ul class="perks">
      <li><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.5"/><circle cx="17" cy="17.5" r="1.5"/></svg>${p.note?p.note+' · delivery arranged with you':'Shipping €9.90 + VAT, all over Europe with FedEx'}</li>
      <li><svg class="ico" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg>30-day returns</li>
      <li><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>${p.c==='bio'?'Lab results by email':((p.f||[]).find(x=>x[0]==='Warranty')||[,'2 years'])[1].replace(/ years?/,'-year')+' warranty'}</li>
    </ul>
    ${p.c==='bio'?'':'<div class="try"><div><b>Try it at Ladata Matosinhos</b>Book a session and test it before you buy.</div><a href="https://www.bookladata.com/appointments" target="_blank" rel="noopener">Book</a></div>'}
    <div class="acc">
      <details><summary>Description</summary><div class="in"><p>${p.d}</p>${p.opts?`<p>${p.opts.replace(/<\/?b>/g,'')}.</p>`:''}</div></details>
      <details${p.f&&p.f.length>4?' open':''}><summary>${p.c==='sauna'?'Technical specifications':'Details'}</summary><div class="in"><dl class="facts">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div></details>
      <details><summary>Shipping &amp; returns</summary><div class="in"><p>${p.c==='bio'?'The kit includes the prepaid return to the lab. ':''}${p.note?'Delivery and installation are arranged with you after the order. ':''}Orders ship from Porto within 1–2 working days. Shipping is €9.90 + VAT on every order, all over Europe with FedEx.</p><p>Changed your mind? Return unused products within 30 days.</p></div></details>
    </div>`;
  const b=BAND[p.c]||BAND.def;
  $('band').className='bfb';
  {const t=Math.max(0,BF_END-Date.now()),d=Math.floor(t/864e5),h=Math.floor(t/36e5)%24,m=Math.floor(t/6e4)%60;
  $('band').innerHTML=`<span class="tag">Black Friday</span><div class="mid"><h2>15% off everything</h2><p>Now until 1 December · while stock lasts</p></div><div class="r"><div class="cd" aria-label="Time left in the sale">${d}<small>d</small><i>·</i>${String(h).padStart(2,'0')}<small>h</small><i>·</i>${String(m).padStart(2,'0')}<small>m</small></div><a href="/shop#${CH[p.c]}">Shop the sale &rarr;</a></div>`}
  const same=P.filter(x=>x.c===p.c&&x!==p&&x.c!=='sauna'),other=P.filter(x=>x.c!==p.c&&x.c!=='sauna'&&!x.out);
  const pick=same.slice(0,2).concat(other.filter((_,i)=>i%5===P.indexOf(p)%5)).slice(0,4);
  while(pick.length<4){const x=other.find(o=>!pick.includes(o));if(!x)break;pick.push(x)}
  $('more').innerHTML=pick.map(x=>`<a class="card" href="#${x.slug}"><div class="t"><img class="${x.cover?'cover':''}" src="/img/${x.slug}.jpg" alt="${x.n}" loading="lazy"></div><div><div class="nm">${x.n}</div><div class="cs">${x.s}</div><div class="pr">${x.p==null?'Price to be confirmed':x.was?`<span style="color:var(--sale)">${eur(x.p)}</span> <s style="color:var(--muted)">${eur(x.was)}</s>`:eur(x.p)}${x.p==null?'':'<span class="vat">VAT not included</span>'}</div></div></a>`).join('');
  $('mbar').innerHTML=`<div><b>${p.n}</b>${p.p==null?'Price to be confirmed':eur(p.p)+(p.was?` <s style="color:var(--muted)">${eur(p.was)}</s>`:'')+' <small style="color:var(--muted)">excl. VAT</small>'}</div><button id="mAdd">Add to bag</button>`;
  if(window._io)window._io.disconnect();window._io=new IntersectionObserver(([en])=>$('mbar').classList.toggle('on',!en.isIntersecting));window._io.observe($('addBtn'));
  $('mAdd').onclick=()=>$('addBtn').click();
  $('addBtn').onclick=()=>LadataBag.add(p,$('addBtn'));
  $('wishBtn').onclick=e=>{wish.has(p.slug)?wish.delete(p.slug):wish.add(p.slug);e.currentTarget.setAttribute('aria-pressed',wish.has(p.slug))};
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove('on'),2000)}
document.addEventListener('click',e=>{if(e.target.closest('a[href="#"]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,.gal'))return;const k=P.findIndex(x=>x.slug===(location.hash.slice(1)||'theragun-mini'));if(e.key==='ArrowRight')location.hash=P[(k+1)%P.length].slug;if(e.key==='ArrowLeft')location.hash=P[(k-1+P.length)%P.length].slug});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0})});
render();
</script>
