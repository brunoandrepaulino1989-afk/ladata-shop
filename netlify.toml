[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URLs: /shop, /product, /success
[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200
[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200
[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/shipping"
  to = "/shipping.html"
  status = 200
[[redirects]]
  from = "/returns"
  to = "/returns.html"
  status = 200
[[redirects]]
  from = "/warranty"
  to = "/warranty.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Keep server code and notes off the public site
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
