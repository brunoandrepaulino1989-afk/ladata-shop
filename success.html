<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order confirmed · Ladata</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#111;--muted:#6b6b6b;--line:#e3e3e1;--cream:#f6f1e7;--ok:#2f7a4a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
header{border-bottom:1px solid var(--line)}
header .in{max-width:1180px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center}
header img{height:30px;width:auto;display:block}
main{max-width:640px;margin:0 auto;padding:56px 16px 80px}
.ok{width:48px;height:48px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:20px}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.05;margin:0 0 12px}
.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:24px 0;font-variant-numeric:tabular-nums;font-size:14.5px}
td{padding:10px 0;border-top:1px solid var(--line)}td.r{text-align:right;white-space:nowrap}
tr.t td{border-top:1px solid var(--ink);font-weight:700;font-size:16px}
.box{background:var(--cream);padding:16px 18px;font-size:14.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;border-radius:999px;padding:13px 22px;font-weight:600;border:1px solid var(--ink);text-decoration:none}
.btn.dark{background:var(--ink);color:#fff}
</style>
</head>
<body>
<header><div class="in"><a href="/" aria-label="Ladata homepage"><img src="/img/ladata-logo.png" alt="Ladata"></a></div></header>
<main id="main">
  <p class="muted">Loading your order…</p>
</main>
<script>
(async function(){
  const m=document.getElementById('main');
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const eur=c=>'€'+(c/100).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2});
  const id=new URLSearchParams(location.search).get('session_id');
  const back='<div class="btns"><a class="btn dark" href="/shop#all">Continue shopping</a><a class="btn" href="https://www.bookladata.com/appointments" target="_blank" rel="noopener">Book a session</a></div>';
  try{
    const r=await fetch('/api/order?session_id='+encodeURIComponent(id||''));const d=await r.json();
    if(!r.ok)throw new Error(d.error||'We could not find this order.');
    try{localStorage.removeItem('ladata-cart')}catch(e){}
    const rows=d.lines.map(l=>`<tr><td>${esc(l.name)}${/^(Shipping|VAT)/.test(l.name)?'':' × '+l.qty}</td><td class="r">${eur(l.amount)}</td></tr>`).join('');
    m.innerHTML=`<div class="ok">✓</div><h1>Thank you, ${esc(d.first)}.</h1>
      <p>Your order <b>${esc(d.no)}</b> is ${d.paid?'confirmed':'received'}. We sent a confirmation email to <b>${esc(d.email)}</b>.</p>
      ${d.paid?'':'<p class="muted">Your payment is still being processed. We will email you as soon as it is confirmed.</p>'}
      <table>${rows}<tr class="t"><td>Total</td><td class="r">${eur(d.total)}</td></tr></table>
      <div class="box"><b>Delivery to</b><br>${esc(d.address)}<br>Shipped with FedEx. You will get the tracking link by email.</div>${back}`;
    document.title='Order '+d.no+' · Ladata';
  }catch(e){
    m.innerHTML=`<h1>We could not show this order.</h1><p class="muted">${esc(e.message)} If you paid, you will still receive a confirmation email. Questions? Reply to that email or write to us.</p>${back}`;
  }
})();
</script>
</body>
</html>
